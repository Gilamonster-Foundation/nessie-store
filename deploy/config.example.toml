# nessie-store configuration. Install to /etc/nessie-store/config.toml.
# Generate a fresh default with: nessie-store init --config config.toml

listen = "0.0.0.0:8443"
data_dir = "/var/lib/nessie-store"
backend = "zfs"

admin_username = "admin"
# Prefer the NESSIE_ADMIN_PASSWORD env (see environment.example); this is the fallback.
admin_password = "admin"

# Reported cluster identity (clients cache the minted UUIDs in data_dir/identity.json).
cluster_name = "nessie-store"
svm_name = "svm0"
node_serial_number = "SIM-1-0000000001"
ontap_version = "9.14.1"
# The data-LIF IP clients mount / Trident probes. Set to this host's reachable IP.
data_lif = "192.168.1.100"

# ZFS backend settings (used when backend = "zfs").
zfs_pool = "ontap-sim"
# Only used when nfs_enabled = false (the legacy host-kernel-NFS export path).
zfs_nfs_clients = ["192.168.0.0/16", "10.42.0.0/16"]
# Owner/mode stamped on each volume root. For a SHARED agent workspace (a pod and
# the host both read/write the same tree), set a set-GID root so new files created
# over NFS inherit the shared group, and let the embedded server own each file as
# its AUTH_UNIX caller (F5). The daemon must hold CAP_CHOWN — it runs as root
# (k8s `privileged: true`) — to own files as arbitrary callers.
# zfs_dataset_owner = "1000:1001"   # uid:gid — e.g. worker uid : shared "agents" gid
# zfs_dataset_mode  = "2775"        # rwxrwsr-x: set-GID so children inherit the group

# Embedded userspace NFS server (the data plane). When true, nessie-store serves
# NFSv3 itself — NO host kernel NFS server (rpc.nfsd/exportfs) is needed, and the
# ZFS backend stops writing /etc/exports.d/. Clients mount with:
#   mount -t nfs -o nfsvers=3,proto=tcp,port=2049,mountport=2049,nolock <data_lif>:/ ...
nfs_enabled = true
nfs_listen = "0.0.0.0:2049"
# Directory tree served; volume junctions mount under it.
nfs_export_root = "/srv"
# Export path clients mount (<host>:/<name>); empty serves the bare root.
nfs_export_name = ""

# Optional REAPI (Bazel remote cache) gRPC face, beside the ONTAP control plane —
# a Bazel remote cache with no BuildBarn to stand up. SHA-256-native (a blob the
# client uploads by its SHA-256 digest is stored under that digest, no index/recompute),
# self-attesting (k=1 write-through). Absent = no REAPI server. Point Bazel at it with:
#   build --remote_cache=grpc://<host>:8980
# [reapi]
# enabled = true
# listen = "0.0.0.0:8980"        # gRPC bind (distinct from the HTTPS `listen` above)
# instance_name = ""             # "" = the default instance
# ac_update_enabled = true       # allow UpdateActionResult (also needs an AC backend + signer)

# Content-addressed store node. When present, the REAPI / S3 faces below share THIS
# store (one set of blobs) and it runs retention maintenance. backend = "mem" (the
# default) loses blobs on restart; "disk" keeps them under `path`.
#
# mode = "lru" (default): over `byte_budget`, evict coldest first - blobs another
#   holder also has, then sole copies (this is a cache). Pinned roots and in-flight
#   writes are never evicted.
# mode = "write_only": never deletes. `byte_budget` is the capacity; a write past it
#   is refused (S3 507 / REAPI RESOURCE_EXHAUSTED), never made room for.
#   replication_factor = R (write_only only; default 2; an error under lru): a write
#   is acknowledged only after R verified copies exist, this node included - i.e.
#   R-1 peers marked `durable = true` that report write_only. Short of that the write
#   fails (S3 503 / REAPI UNAVAILABLE) and the local copy stays for repair. R = 1 is a
#   single-node archive with no redundancy. Startup refuses R-1 > durable peers.
#   replication_factor = 2
# scrub_bytes_per_pass (both modes; default 1073741824 = 1 GiB, 0 = scrub off): bytes
#   a maintenance pass re-reads to check blobs against their digests, resuming where
#   the last pass stopped (the position is in memory: a restart rescans from the
#   start). Set it very high to verify everything every pass. A corrupt blob is
#   reclaimed under lru (a later read refetches it). Under write_only it is moved to
#   <path>/quarantine/ and restored from a peer; the quarantined file is kept and
#   stays charged against byte_budget, so corruption costs capacity. A failed restore
#   is retried every pass, within the same budget, and skipped without a fetch while
#   there is no room. A mirrored write_only node also pushes each scanned blob
#   back up to R copies.
#   scrub_bytes_per_pass = 1073741824
# `byte_budget` is required in both modes. The old mode = "durable" is gone: it is
# now a config parse error.
[cas]
mode = "lru"
byte_budget = 107374182400   # 100 GiB
backend = "disk"
path = "/var/lib/nessie-store/cas"
#
# Static peers (lab only: plain http, unauthenticated; mTLS is the fast-follow).
# A miss is fetched from peers and verified against its digest; `durable = true` is
# a hint of whom to probe and replicate to, believed only if that peer reports
# x-nessie-mode: write_only. List each URL once; advertise_url is this node's own
# URL (that entry is ignored, so one list can be shared). peer_api serves
# GET|HEAD|PUT /cas/v1/blobs/{algo}:{hex} so other nodes can reach this one.
# peers = [{ url = "http://nessie-2:8443", durable = true }, { url = "http://nessie-3:8443" }]
# peer_api = true
# advertise_url = "http://nessie-1:8443"

# Optional S3 object face over the same store. The daemon REFUSES to start it while
# secret_key is still the default: set NESSIE_S3_SECRET_KEY (see environment.example).
# [s3]
# enabled = true
# listen = "0.0.0.0:9000"
# access_key = "nessie"
